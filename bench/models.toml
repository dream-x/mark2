# Матрица v2 (2026-11-03): обновлена на свежие модели ollama-библиотеки.
# qwen9 оставлен якорем — по нему сравниваем v1 (август) и v2 прогоны харнеса.
# gpt-oss:20b локально исключён: битый блоб (см. docs/notes/e2e-findings-20260824.md)

[[models]]
alias = "qwen9"
model = "qwen3.5:9b"
base_url = "http://localhost:11434/v1"
timeout_multiplier = 1.0

[[models]]
alias = "bolt4"
model = "nemotron-3.5-bolt:e4b"
base_url = "http://localhost:11434/v1"
timeout_multiplier = 1.0

# edit_strategy (опционально): формат тула edit для этой модели —
# "search_replace" (дефолт mark2) | "whole_file"; ранер передаёт его в
# [models."<model>"] проектного .mark2.toml.

# whole_file: на длинных сессиях flint роняет поля search/replace-edit (вызов
# без old_string/new_string) и спасается только перезаписью файла целиком —
# наблюдение прогонов 2026-11-03/04.
[[models]]
alias = "flint40"
model = "flint:40b"
base_url = "http://localhost:11434/v1"
timeout_multiplier = 2.0
edit_strategy = "whole_file"

[[models]]
alias = "qwen27"
model = "qwen3.8:27b"
base_url = "http://white.local:11434/v1"
timeout_multiplier = 2.5

# deepseek-v4.1-flash:cloud требует платного плана Ollama Cloud (HTTP 402);
# gemma4:31b-cloud — облачная модель из Free-плана.
[[models]]
alias = "gemma31c"
model = "gemma4:31b-cloud"
base_url = "http://localhost:11434/v1"
timeout_multiplier = 2.5

# --- Матрица v3 (2026-11-04): проектный тир + эксперимент «квант × железо». ---
# Одна модель qwen3.6:35b-a3b-coding в четырёх ипостасях: q4 на Mac и на white
# (RTX 5090), MLX-fp4 и mxfp8/bf16 — только Mac (в 32GB VRAM не влезают).
# Теги *-nvfp4 в ollama — это MLX-формат (Apple-only), на NVIDIA не идут.

[[models]]
alias = "qwen36c"
model = "qwen3.6:35b-a3b-coding"
base_url = "http://localhost:11434/v1"
timeout_multiplier = 2.0

[[models]]
