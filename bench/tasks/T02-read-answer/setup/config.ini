; Deployment configuration for the ingest service.
; Do not edit by hand in production.

[general]
service_name = ingest
environment = staging
log_level = warn
workers = 6

[server]
host = 0.0.0.0
port = 4821
read_timeout_ms = 15000
max_body_bytes = 1048576
tls = off

[metrics]
enabled = true
host = 127.0.0.1
port = 9102
scrape_interval_s = 30

[admin]
host = 127.0.0.1
port = 7000
token_ttl_s = 3600

[storage]
backend = sqlite
path = /var/lib/ingest/data.db
vacuum_on_start = false
