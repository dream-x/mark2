[workspace]
resolver = "3"
members = ["crates/core", "crates/providers", "crates/cli"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
# Внутренние крейты
mark2-core = { path = "crates/core" }
mark2-providers = { path = "crates/providers" }

# Async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# HTTP / SSE
# В reqwest 0.13 фича `rustls-tls` переименована в `rustls`
# (rustls + aws-lc-rs + rustls-platform-verifier для системных корней).
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls",
] }
eventsource-stream = "0.2"

# Сериализация
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"

# JSON Schema (схемы тулов + валидация аргументов)
schemars = "1"
jsonschema = "0.51"

# CLI
clap = { version = "4", features = ["derive"] }

# Ошибки
thiserror = "2"
anyhow = "1"

# Логи
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Прочее
dirs = "6"
jiff = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
