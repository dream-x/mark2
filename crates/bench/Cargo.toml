[package]
name = "mark2-bench"
description = "Ранер бенчмарка mark2: модели × агентные задачи, программная верификация"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "mark2-bench"
path = "src/main.rs"

[dependencies]
# Типы сессий: метрики считаются по реальным SessionItem/ContentBlock, а не по
# самодельному разбору JSONL.
mark2-core.workspace = true

serde.workspace = true
serde_json.workspace = true
toml.workspace = true

clap.workspace = true
anyhow.workspace = true
jiff.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Изолированные tmp-cwd и tmp-$HOME на каждый прогон.
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
